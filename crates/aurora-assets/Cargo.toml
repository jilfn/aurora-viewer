[package]
name = "aurora-assets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
base64 = "0.23.1"
flate2 = "1.1.10"
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png", "tga", "jpeg", "bmp"] }
log = "0.4.34"
# JPEG2000 decoding (j2k.rs), pure Rust; simd: its SIMD paths (fearless_simd, pure Rust too)
hayro-jpeg2000 = { version = "0.5.0", default-features = false, features = ["simd"] }
# JPEG2000 encoding (j2k/encode.rs): the Rust port of OpenJPEG, no C
openjp2 = { version = "0.7.2", default-features = false }
parking_lot = "0.13.0"
rayon = "1.12.0"
serde_json = "1.0.151"
thiserror = "2.0.21"
uuid = "1.27.0"
# Vorbis encoding of sound uploads (import_sound.rs): a Rust port of libvorbis 1.3.7's encoder
# (its VorbisEncoder is not in its documented interface, hence the exact version) and Ogg pages
zvidlib-vorbis-encoder = "=0.5.0"
ogg = "0.9.2"
# meshoptimizer 1.3 in Rust (src/meshopt.rs gives it the names of the meshopt crate)
meshopt-pure = { version = "1.3.0", default-features = false }
parry3d = "0.31.1"
# AES-256-GCM, HKDF and HMAC of the sealed cache files (sealed.rs): RustCrypto,
# already in the tree through the TLS provider (rustls-rustcrypto), MIT / Apache-2.0
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"] }
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.1"
getrandom = "0.4.3"
aurora-llsd = { path = "../aurora-llsd" }

[build-dependencies]
cc = "1.6.0"

[lints]
workspace = true
